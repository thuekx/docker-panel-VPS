# Nostek Panel core stack (PANEL-01). Installed by packages/panel-01 to /srv/nostek/core.
# Only `edge` (80/443) and `sftp` (2222, SFTP-01) publish ports. The panel never mounts the Docker socket; it reads Docker through a read-only socket
# proxy and changes sites only through nostek-agent (host service, fixed actions, socket in /run/nostek-agent).
# Networks: nostek-panel = edge + panel only; nostek-edge = edge + site web servers (sites never reach the panel);
# nostek-ctl = internal, panel/edge to the socket proxy.
# Values come from .env next to this file (written by the installer): PANEL_DOMAIN, PANEL_IMAGE, PANEL_HOSTNAME,
# NOSTEK_DATA (default /srv/nostek), NOSTEK_STATE (default /var/lib/nostek), ACME_CA_SERVER (default Let's Encrypt production).
name: nostek-core

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  edge:
    <<: *hardening
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    depends_on: [docker-api]
    ports:
      - "80:8000"
      - "443:8443"
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --ping=true
      - --ping.entryPoint=ping
      - --entryPoints.ping.address=:8082
      - --entryPoints.web.address=:8000
      - --entryPoints.web.http.redirections.entryPoint.to=:443
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.permanent=true
      - --entryPoints.websecure.address=:8443
      - --entryPoints.websecure.http.tls=true
      - --entryPoints.websecure.http3=false
      # SITE-03: proxies or CDNs in front (panel-01 --trusted-proxies): the edge believes their X-Forwarded-For,
      # so statistics, login attempts and the firewall see the visitor. Nobody else's header is believed.
      - --entryPoints.websecure.forwardedHeaders.trustedIPs=${EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      # large uploads (panel file manager and database import, WordPress media) need more than the 60 s default
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=30m
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-api:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=nostek-edge
      # native websites (NATIVE-01): the agent writes one file per site; read-only here
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      # SEC-01 wave 3 + OPS-01: access log for the login-attempts view and the visitor statistics; a few fields
      # and two headers (Referer, User-Agent). The agent reads it every minute and empties it past 32 MB.
      - --accessLog=true
      - --accessLog.filePath=/logs/access.log
      - --accessLog.format=json
      - --accessLog.bufferingSize=50
      - --accessLog.fields.defaultMode=drop
      - --accessLog.fields.names.ClientHost=keep
      - --accessLog.fields.names.RequestHost=keep
      - --accessLog.fields.names.RequestMethod=keep
      - --accessLog.fields.names.RequestPath=keep
      - --accessLog.fields.names.DownstreamStatus=keep
      - --accessLog.fields.names.StartUTC=keep
      - --accessLog.fields.names.DownstreamContentSize=keep
      - --accessLog.fields.headers.defaultMode=drop
      - --accessLog.fields.headers.names.Referer=keep
      - --accessLog.fields.headers.names.User-Agent=keep
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.caServer=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesResolvers.le.acme.httpChallenge.entryPoint=web
      # CERT-01: wildcard certificates (zone + *.zone) through the DNS challenge at ClouDNS. The agent writes the
      # API sub-user to <data>/edge/dns (files readable by this user only) and restarts the edge; without them
      # only this resolver fails, Let's Encrypt over HTTP goes on.
      - --certificatesResolvers.dns.acme.storage=/acme/acme-dns.json
      - --certificatesResolvers.dns.acme.caServer=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesResolvers.dns.acme.dnsChallenge.provider=cloudns
    environment:
      CLOUDNS_SUB_AUTH_ID_FILE: /dns/cloudns.sub-auth-id
      CLOUDNS_AUTH_PASSWORD_FILE: /dns/cloudns.password
    volumes:
      - ${NOSTEK_DATA:-/srv/nostek}/edge/acme:/acme
      - ${NOSTEK_DATA:-/srv/nostek}/edge/dynamic:/dynamic:ro
      - ${NOSTEK_DATA:-/srv/nostek}/edge/dns:/dns:ro
      - ${NOSTEK_DATA:-/srv/nostek}/edge/logs:/logs
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=ping", "--entryPoints.ping.address=:8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nostek-edge, nostek-panel, nostek-ctl]

  # SEC-01 wave 3b: the web application firewall (Coraza + OWASP CRS) from the panel image. The edge sends a
  # website's visits here only while its WAF is on; the agent writes the websites' rules to <data>/edge/waf.
  waf:
    <<: *hardening
    image: ${PANEL_IMAGE:?PANEL_IMAGE is required}
    entrypoint: ["/nostek-waf"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    mem_limit: 1g
    environment:
      WAF_CONFIG: /config
      WAF_LOG: /logs/waf.log
      EDGE_TRUSTED_PROXIES: ${EDGE_TRUSTED_PROXIES:-}
    volumes:
      - ${NOSTEK_DATA:-/srv/nostek}/edge/waf:/config:ro
      - ${NOSTEK_DATA:-/srv/nostek}/edge/logs:/logs
    healthcheck:
      test: ["CMD", "/nostek-waf", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nostek-edge]

  # SFTP-01: SFTP for the websites' files (no shell). Accounts per website come from the agent (<data>/sftp, read
  # only here); each login is locked to its website's folder. Root inside the container only to give new files to
  # the website's file user: every capability is dropped except those three. No network but its own.
  sftp:
    <<: *hardening
    image: ${PANEL_IMAGE:?PANEL_IMAGE is required}
    entrypoint: ["/nostek-sftp"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 256
    ports:
      - "2222:2222"
    environment:
      SFTP_CONFIG: /config
      SFTP_STATE: /state
    volumes:
      - ${NOSTEK_DATA:-/srv/nostek}/sftp:/config:ro
      - ${NOSTEK_DATA:-/srv/nostek}/sftp-state:/state
      - ${NOSTEK_DATA:-/srv/nostek}/sites:/sites
    healthcheck:
      test: ["CMD", "/nostek-sftp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nostek-sftp]

  docker-api:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      # read-only allow-list; everything not listed (exec, build, secrets, POST, ...) is refused
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      VERSION: "1"
      PING: "1"
      EVENTS: "1"
      POST: "0"
      DISABLE_IPV6: "1"   # internal network is IPv4 only; also avoids a crash on hosts without IPv6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [nostek-ctl]

  panel:
    <<: *hardening
    image: ${PANEL_IMAGE:?PANEL_IMAGE is required}
    read_only: true
    cap_drop: [ALL]
    depends_on: [docker-api]
    environment:
      NP_BASE_URL: https://${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      NP_HOSTNAME: ${PANEL_HOSTNAME:-}
      NP_PROC: /proc
      NP_DOCKER_URL: http://docker-api:2375
      NP_BACKUP_STATUS: /host/backup/last
      NP_AGENT_SOCKET: /run/nostek-agent/agent.sock
      NP_TRUST_PROXY: "1"
      NP_LANG: id
      TZ: Asia/Jakarta
    volumes:
      - ${NOSTEK_DATA:-/srv/nostek}/panel:/data
      - ${NOSTEK_STATE:-/var/lib/nostek}/backup:/host/backup:ro
      - /run/nostek-agent:/run/nostek-agent:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: nostek-panel
      traefik.http.routers.panel.rule: Host(`${PANEL_DOMAIN}`)
      traefik.http.routers.panel.entrypoints: websecure
      traefik.http.routers.panel.tls.certresolver: le
      traefik.http.routers.panel.middlewares: panel-hsts
      traefik.http.middlewares.panel-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.panel-hsts.headers.stsIncludeSubdomains: "false"
      traefik.http.services.panel.loadbalancer.server.port: "8080"
    networks: [nostek-panel, nostek-ctl]

networks:
  nostek-edge:
    name: nostek-edge
  nostek-panel:
    name: nostek-panel
  nostek-ctl:
    name: nostek-ctl
    internal: true
  nostek-sftp:
    name: nostek-sftp
