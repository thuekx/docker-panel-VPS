name: packages
on:
  pull_request:
    paths: ['packages/**', 'panel/**', 'agent/**', 'deploy/**', '.github/workflows/packages.yml']
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      host01: ${{ steps.f.outputs.host01 }}
      host02: ${{ steps.f.outputs.host02 }}
      inst01: ${{ steps.f.outputs.inst01 }}
      upd01: ${{ steps.f.outputs.upd01 }}
      panel01: ${{ steps.f.outputs.panel01 }}
      app: ${{ steps.f.outputs.app }}
      agent: ${{ steps.f.outputs.agent }}
      site01: ${{ steps.f.outputs.site01 }}
      native01: ${{ steps.f.outputs.native01 }}
      mig01: ${{ steps.f.outputs.mig01 }}
      dom01: ${{ steps.f.outputs.dom01 }}
      sec01: ${{ steps.f.outputs.sec01 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base" HEAD)"
          for p in host-01 host-02 inst-01 upd-01; do
            k="${p/-0/0}"
            if grep -qE "^(packages/$p/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "$k=true" >> "$GITHUB_OUTPUT"; else echo "$k=false" >> "$GITHUB_OUTPUT"; fi
          done
          if grep -qE "^(packages/panel-01/|panel/|deploy/core/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "panel01=true" >> "$GITHUB_OUTPUT"; else echo "panel01=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(panel/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(agent/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "agent=true" >> "$GITHUB_OUTPUT"; else echo "agent=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(packages/site-01/|agent/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "site01=true" >> "$GITHUB_OUTPUT"; else echo "site01=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(packages/native-01/|agent/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "native01=true" >> "$GITHUB_OUTPUT"; else echo "native01=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(packages/site-01/|agent/|panel/web/plugin/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "mig01=true" >> "$GITHUB_OUTPUT"; else echo "mig01=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(packages/site-01/|agent/|deploy/core/|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "dom01=true" >> "$GITHUB_OUTPUT"; else echo "dom01=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^(packages/site-01/|agent/|deploy/core/|panel/internal/waf/|panel/cmd/nostek-waf/|panel/internal/sftpd/|panel/cmd/nostek-sftp/|panel/go\.(mod|sum)|\.github/workflows/packages\.yml)" <<<"$changed"; then echo "sec01=true" >> "$GITHUB_OUTPUT"; else echo "sec01=false" >> "$GITHUB_OUTPUT"; fi
  host-01:
    needs: select
    if: needs.select.outputs.host01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get -o Dpkg::Use-Pty=0 install -y -q shellcheck openssh-server < /dev/null
      - name: shellcheck
        run: shellcheck -S warning packages/host-01/host-01-user-ssh.sh packages/host-01/tests/*.sh packages/host-01/tests/stubs/*
      - name: lock
        run: cd packages/host-01 && sha256sum -c host-01.lock
      - name: harness
        run: sudo bash packages/host-01/tests/harness.sh
      - name: mutants
        run: sudo bash packages/host-01/tests/mutants.sh
  host-02:
    needs: select
    if: needs.select.outputs.host02 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning packages/host-02/host-02-baseline.sh packages/host-02/tests/*.sh packages/host-02/tests/stubs/*
      - name: lock
        run: cd packages/host-02 && sha256sum -c host-02.lock
      - name: harness
        run: sudo bash packages/host-02/tests/harness.sh
      - name: mutants
        run: sudo bash packages/host-02/tests/mutants.sh
  inst-01:
    needs: select
    if: needs.select.outputs.inst01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning packages/inst-01/nostek-install.sh packages/inst-01/tests/*.sh packages/inst-01/tests/stubs/*
      - name: lock
        run: cd packages/inst-01 && sha256sum -c inst-01.lock
      - name: harness
        run: sudo bash packages/inst-01/tests/harness.sh
      - name: mutants
        run: sudo bash packages/inst-01/tests/mutants.sh
  upd-01:
    needs: select
    if: needs.select.outputs.upd01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning packages/upd-01/nostek-update.sh packages/upd-01/tests/*.sh
      - name: lock
        run: cd packages/upd-01 && sha256sum -c upd-01.lock
      - name: harness
        run: sudo bash packages/upd-01/tests/harness.sh
  app:
    needs: select
    if: needs.select.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: panel/go.mod, cache-dependency-path: panel/go.sum }
      - name: gofmt
        run: cd panel && test -z "$(gofmt -l .)"
      - name: vet
        run: cd panel && go vet ./...
      - name: test
        run: cd panel && go test ./...
      - name: vendored UI libraries unchanged
        run: cd panel/web/static/vendor && sha256sum -c VERSIONS.sha256
  panel-01:
    needs: select
    if: needs.select.outputs.panel01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: shellcheck
        run: shellcheck -S warning packages/panel-01/panel-01-core.sh packages/panel-01/tests/*.sh packages/panel-01/tests/stubs/*
      - name: lock
        run: cd packages/panel-01 && sha256sum -c panel-01.lock
      - name: compose file valid
        run: PANEL_DOMAIN=panel.example.test PANEL_IMAGE=nostek/panel:ci docker compose -f deploy/core/compose.yml config -q
      - name: harness (real Docker; builds the image, runs the stack on 80/443)
        run: sudo bash packages/panel-01/tests/harness.sh
      - name: mutants
        run: sudo bash packages/panel-01/tests/mutants.sh
  agent:
    needs: select
    if: needs.select.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - name: gofmt
        run: cd agent && test -z "$(gofmt -l .)"
      - name: vet
        run: cd agent && go vet ./...
      - name: test
        run: cd agent && go test -race ./...
  site-01:
    needs: select
    if: needs.select.outputs.site01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - name: shellcheck
        run: shellcheck -S warning packages/site-01/site-01-agent.sh packages/site-01/tests/*.sh
      - name: lock
        run: cd packages/site-01 && sha256sum -c site-01.lock
      - name: harness (real Docker; builds the agent, creates Apache and Nginx WordPress sites)
        env:
          NODE_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: sudo env "HARNESS_NODE_GIT_BRANCH=$NODE_GIT_BRANCH" bash packages/site-01/tests/harness.sh
      - name: mutants
        run: sudo env "PATH=$PATH" bash packages/site-01/tests/mutants.sh
  mig-01:
    needs: select
    if: needs.select.outputs.mig01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: shellcheck
        run: shellcheck -S warning packages/site-01/tests/migrate.sh
      - name: plugin syntax
        run: php -l panel/web/plugin/nostek-migrate.php
      - name: harness (real Docker; an old WordPress behind HTTPS with the plugin, cPanel backups)
        run: sudo bash packages/site-01/tests/migrate.sh
  dom-01:
    needs: select
    if: needs.select.outputs.dom01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: shellcheck
        run: shellcheck -S warning packages/site-01/tests/domains.sh
      - name: harness (real Docker and a real Traefik edge; names, redirects, the move to the domain)
        run: sudo bash packages/site-01/tests/domains.sh
  sec-01:
    needs: select
    if: needs.select.outputs.sec01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: panel/go.mod, cache: false }
      - name: shellcheck
        run: shellcheck -S warning packages/site-01/tests/security.sh
      - name: harness (real Docker and a real Traefik edge as uid 65532; IP block, protected folder, hotlink, malware scan, WAF, SFTP)
        run: sudo env "PATH=$PATH" bash packages/site-01/tests/security.sh
  native-01:
    needs: select
    if: needs.select.outputs.native01 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - name: shellcheck
        run: shellcheck -S warning -x packages/native-01/native-01-host.sh packages/native-01/tests/*.sh
      - name: lock
        run: cd packages/native-01 && sha256sum -c native-01.lock
      - name: harness (real packages on this throwaway VM; Nginx, PHP-FPM 8.1-8.5, MariaDB, WP-CLI)
        run: sudo env "PATH=$PATH" NATIVE01_HARNESS_ON_THROWAWAY_VM=1 bash packages/native-01/tests/harness.sh
